<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Neumorphic Background Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- Translucent Colorful Gradient Ribbon Palettes -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A44" />
      <stop offset="30%" stop-color="#FC6076" />
      <stop offset="70%" stop-color="#B721FF" />
      <stop offset="100%" stop-color="#21D4FD" />
    </linearGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Pure White Base Squircle -->
  <rect x="36" y="36" width="440" height="440" rx="110" fill="#FFFFFF" filter="url(#softShadow)" />
  <rect x="36" y="36" width="440" height="440" rx="110" fill="none" stroke="rgba(241, 245, 249, 0.9)" stroke-width="2" />

  <!-- 3D Ribbon Hanja Character (漢) Stylized Loop -->
  <g transform="translate(40, 30)">
    <!-- Water Radical Ribbon (left) -->
    <path d="M 120 160 C 135 150, 160 165, 150 185 C 140 205, 115 195, 120 160 Z" fill="url(#ribbonGrad)" opacity="0.9" />
    <path d="M 105 230 C 120 220, 145 235, 135 255 C 125 275, 100 265, 105 230 Z" fill="url(#ribbonGrad)" opacity="0.95" />
    <path d="M 95 350 C 105 320, 145 285, 160 270 C 150 305, 125 355, 95 350 Z" fill="url(#ribbonGrad)" />

    <!-- Right Component Ribbon (Roof & Structure) -->
    <path d="M 180 150 C 230 145, 300 145, 350 150 C 355 165, 340 180, 310 180 L 220 180 C 190 180, 175 165, 180 150 Z" fill="url(#ribbonGrad)" />
    
    <!-- Central Ribbon Tube -->
    <path d="M 265 170 C 275 220, 275 280, 265 340 C 250 345, 240 330, 245 280 C 250 230, 245 185, 265 170 Z" fill="url(#ribbonGrad)" />

    <!-- Interlocking Cross Ribbons -->
    <path d="M 190 225 Q 265 210 340 225 C 345 240, 335 255, 310 250 Q 265 240 220 250 C 195 255, 185 240, 190 225 Z" fill="url(#ribbonGrad)" opacity="0.88" />
    <path d="M 175 305 Q 265 290 355 305 C 360 320, 350 335, 325 330 Q 265 320 205 330 C 180 335, 170 320, 175 305 Z" fill="url(#ribbonGrad)" opacity="0.92" />
    
    <!-- Ribbon Flairs -->
    <path d="M 210 340 C 220 370, 190 405, 160 415 C 150 405, 170 380, 195 350 Z" fill="url(#ribbonGrad)" />
    <path d="M 320 340 C 310 370, 340 405, 370 415 C 380 405, 360 380, 335 350 Z" fill="url(#ribbonGrad)" />

    <!-- Soft Glass Reflection Highlight -->
    <path d="M 190 155 Q 265 150 340 155 C 340 165, 330 170, 310 170 L 220 170 C 200 170, 190 165, 190 155 Z" fill="url(#glossGrad)" />
  </g>
</svg>
